[project]
name = "credit-score"
version = "0.1.0"
description = "Libraries needed to fit and deploy this project"
requires-python = ">=3.11, <3.13"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "locust>=2.46.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "credit"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
