apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  credit-dashboard.json: |
    {
      "uid": "credit-hw4",
      "title": "Credit score service",
      "tags": ["credit", "hw4"],
      "schemaVersion": 39,
      "refresh": "15s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1, "title": "Prediction requests / second", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": "Prometheus",
          "targets": [{"expr": "sum(rate(http_requests_total{service=\"credit-score\",handler=~\"/v1/predict.*\"}[$__rate_interval]))", "legendFormat": "RPS"}]
        },
        {
          "id": 2, "title": "HTTP responses", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": "Prometheus",
          "targets": [{"expr": "sum by (status) (rate(http_requests_total{service=\"credit-score\",handler=~\"/v1/predict.*\"}[$__rate_interval]))", "legendFormat": "{{status}}"}]
        },
        {
          "id": 3, "title": "Latency p50 / p95", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"credit-score\",handler=~\"/v1/predict.*\"}[$__rate_interval])))", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"credit-score\",handler=~\"/v1/predict.*\"}[$__rate_interval])))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 4, "title": "Positive predictions, %", "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}},
          "targets": [{"expr": "100 * sum(rate(credit_predictions_total{service=\"credit-score\",result=\"positive\"}[$__rate_interval])) / clamp_min(sum(rate(credit_predictions_total{service=\"credit-score\"}[$__rate_interval])), 0.000001)", "legendFormat": "positive"}]
        },
        {
          "id": 5, "title": "Score distribution", "type": "heatmap",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": "Prometheus",
          "targets": [{"expr": "sum by (le) (rate(credit_prediction_score_bucket{service=\"credit-score\"}[$__rate_interval]))", "format": "heatmap", "legendFormat": "{{le}}"}]
        },
        {
          "id": 6, "title": "Model version by Pod", "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": "Prometheus",
          "targets": [{"expr": "credit_model_info{service=\"credit-score\"} == 1", "instant": true, "format": "table"}]
        }
      ]
    }
